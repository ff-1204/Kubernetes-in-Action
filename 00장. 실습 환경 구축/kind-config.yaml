kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kia
nodes:
  # 단일 노드: 컨트롤 플레인이 워커 역할까지 겸한다
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # 12~13장(인그레스 / Gateway API) 실습용 포트 개방
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
